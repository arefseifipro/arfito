<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="./css/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
       <h2>ورود ادمین</h2>
      <p>کد ادمین را وارد کنید</p>
      <input type="password" id="admin-code" class="code-input" placeholder="•••••" maxlength="5" inputmode="numeric">
      <button id="login-btn" class="btn btn-primary btn-block">ورود</button>
      <p id="login-error" class="login-error hidden">کد اشتباه است!</p>
      <a href="index.html" class="back-link">بازگشت به صفحه اصلی</a>
    </div>
  </div>
  <div id="admin-panel" class="admin-panel hidden">
    <header class="admin-topbar">
      <div class="container admin-topbar-inner">
        <h1 class="admin-title">پنل مدیریت</h1>
        <div class="admin-actions">
          <button id="sync-btn" class="btn btn-outline btn-sm">همگام‌سازی</button>
          <button id="logout-btn" class="btn btn-outline btn-sm">خروج</button>
        </div>
      </div>
    </header>

    <div class="container">
      <div class="tabs">
        <button class="tab-btn active" data-tab="tab-structure">ساختار دروس</button>
        <button class="tab-btn" data-tab="tab-progress">هفته و پارت</button>
      </div>


      <div id="tab-structure" class="tab-content active">
        <section class="card">
          <h3 class="card-title">ایجاد درس جدید</h3>
          <div class="form-row">
            <input type="text" id="lesson-name" class="input" placeholder="نام درس (مثلاً ریاضی)">
            <select id="lesson-icon" class="input">
              <option value="calculator">ماشین‌حساب</option>
              <option value="book">کتاب</option>
              <option value="flask">آزمایشگاه</option>
              <option value="globe">کره زمین</option>
              <option value="music">موسیقی</option>
              <option value="pen">قلم</option>
            </select>
            <input type="color" id="lesson-color" class="color-input" value="#2563eb">
            <button id="add-lesson-btn" class="btn btn-primary">افزودن درس</button>
          </div>
        </section>


        <section class="card">
          <h3 class="card-title">دروس موجود</h3>
          <div id="lessons-list" class="lessons-list"></div>
        </section>
      </div>

      <div id="tab-progress" class="tab-content">
        <section class="card">
          <h3 class="card-title">افزودن هفته و پارت</h3>
          <div class="form-row">
            <select id="week-lesson" class="input"></select>
            <input type="text" id="week-label" class="input" placeholder="مثلاً هفته پانزدهم">
            <input type="text" id="week-range" class="input" placeholder="مثلاً ۲۳ مرداد الی ۳۱ مرداد">
            <button id="add-week-btn" class="btn btn-primary">افزودن هفته</button>
          </div>
          <div id="weeks-container" class="weeks-container"></div>
        </section>

        <section class="card">
          <h3 class="card-title">ثبت تست زده‌شده</h3>
          <div class="form-row">
            <select id="log-lesson" class="input"></select>
            <select id="log-source" class="input"></select>
            <select id="log-chapter" class="input"></select>
            <input type="number" id="log-count" class="input" placeholder="تعداد تست" min="1">
            <button id="log-btn" class="btn btn-primary">ثبت</button>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="./js/icons.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/admin.js"></script>
</body>
</html>
