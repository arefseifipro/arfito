<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گزارش تست</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   


</head>
<body>
    <div class="container">
        <h1>گزارش تست</h1>

        <div class="initial-inputs">
            <div class="input-group">
                <label for="lessonTitle">عنوان درس:</label>
                <input type="text" id="lessonTitle" placeholder="مثال: ریاضی دوازدهم">
            </div>
        </div>

        <div id="parts-container">
            <!-- پارت‌ها اینجا اضافه می‌شوند -->
        </div>

        <button id="add-part-btn" class="icon-btn"><i class="ri-add-line"></i> افزودن پارت</button>

        
    <div class="print-section">
        <h2>گزارش نهایی</h2>
        <div id="report-output">
            <!-- گزارش نهایی اینجا نمایش داده می‌شود -->
            <p style="color: red;">☉ حداکثر تعداد پارت ها در یک صفحه ده پارت میباشد.</p>
           <p>☉ اول اطلاعات پارت‌ها را وارد کرده و سپس روی دکمه "چاپ گزارش" کلیک کنید تا گزارش تولید و برای پرینت آماده شود.</p>
           <p>☉ در صورت به هم ریختگی صفحه پرینت، ابتدا پی دی اف را دانلود و سپس پرینت کنید.</p>
        </div>
        <div class="btns">
        <button id="print-btn" class="icon-btn"><i class="ri-printer-line"></i> چاپ گزارش</button>
        <button id="report-btn" class="icon-btn"><i class="ri-printer-line"></i> تولید گزارش</button>
        <button id="pdf-btn" class="icon-btn"><i class="ri-printer-line"></i> تولید پی دی اف گزارش</button>
        </div>
    </div>

    </div>

    <script src="script.js"></script>
    <script src="html2pdf.bundle.min.js"></script>
    <!-- ۱. اول html2canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<!-- ۲. بعد jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- ۳. بعد html2pdf (اگر هنوز از آن استفاده می‌کنی، وگرنه می‌توانی حذفش کنی) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>


</body>
</html>
