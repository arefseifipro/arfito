<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروگرس | صفحه کاربر</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- لودینگ اولیه -->
    <div id="initial-loading" class="loading-overlay">
        <div class="loading-spinner">
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
        </div>
        <div class="loading-text">در حال بارگذاری...</div>
        <div class="loading-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <!-- هدر -->
    <header class="view-header">
        <div class="header-right">
            <div class="logo">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <path d="M9 22V12h6v10"/>
                </svg>
            </div>
            <div class="profile-badge">
                <h1 id="profile-info">در حال بارگذاری...</h1>
            </div>
        </div>
    </header>

    <!-- تب‌ها -->
    <div class="admin-tabs">
        <button class="admin-tab active" data-tab="tab1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
            درس‌ها و منابع
        </button>
        <button class="admin-tab" data-tab="tab2">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            هفته‌ها و پارت‌ها
        </button>
    </div>

    <!-- ====== تب ۱ ====== -->
    <main class="admin-main">
        <section id="tab1" class="tab-content active">
            <div class="content-header">
                <h2>درس‌های من</h2>
            </div>
            <div id="lessons-container"></div>
        </section>

        <!-- ====== تب ۲ ====== -->
        <section id="tab2" class="tab-content">
            <div class="content-header">
                <h2>برنامه هفتگی درس‌ها</h2>
            </div>
            <div class="lesson-selector">
                <label>انتخاب درس:</label>
                <select id="week-lesson-select" onchange="loadWeeksForLesson(this.value)">
                    <option value="">-- انتخاب کنید --</option>
                </select>
            </div>
            <div id="weeks-container"></div>
        </section>
    </main>

    <footer class="admin-footer">
        <div class="footer-inner">
            <div class="footer-section">
                <svg viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
                <span class="footer-text">پروگرس</span>
            </div>
            <div class="footer-section">
                <span class="footer-text"> Wrote By ArefSeifi ©</span>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="icons.js"></script>
    <script src="view.js"></script>
</body>
</html>
