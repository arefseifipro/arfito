<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نمای عمومی | پروگرس</title>
    <link rel="stylesheet" href="dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="public-view">
        <!-- درس‌ها -->
        <div class="section" id="public-lessons-section">
            <div class="section-header">
                <h2>📚 درس‌ها</h2>
            </div>
            <div id="public-lessons" class="lessons-grid"></div>
        </div>

        <!-- هفته‌ها و پارت‌ها -->
        <div class="section" id="public-weeks-section">
            <div class="section-header">
                <h2>📅 برنامه هفتگی</h2>
            </div>
            <div id="public-weeks"></div>
        </div>
    </div>

   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="icons.js"></script>
<script>
        const urlParams = new URLSearchParams(window.location.search);
        const linkId = urlParams.get('link');

        if (linkId && linkId !== 'public-view.html') {
            loadPublicData(linkId);
        }

        async function loadPublicData(linkId) {
            const { data: linkData } = await sb
                .from('public_links')
                .select('user_id')
                .eq('link_id', linkId)
                .single();

            if (!linkData) {
                document.querySelector('.dashboard-container').innerHTML = 
                    '<div class="empty-state">❌ لینک نامعتبر است</div>';
                return;
            }

            const userId = linkData.user_id;

            // گرفتن همه داده‌ها
            const [lessonsRes, weeksRes] = await Promise.all([
                sb.from('lessons').select('*').eq('user_id', userId).order('created_at'),
                sb.from('weeks').select('*').eq('user_id', userId).order('week_number')
            ]);

            const lessons = lessonsRes.data || [];
            const weeks = weeksRes.data || [];

            // برای هر درس، منابع و تست‌هاش رو حساب کن
            const lessonsWithStats = await Promise.all(lessons.map(async (lesson) => {
                const { data: sources } = await sb
                    .from('sources')
                    .select('*')
                    .eq('user_id', userId)
                    .eq('lesson_id', lesson.id);

                let totalTests = 0;
                let doneTests = 0;
                if (sources) {
                    sources.forEach(s => {
                        totalTests += s.total_tests || 0;
                        doneTests += s.done_tests || 0;
                    });
                }
                
                return { ...lesson, totalTests, doneTests };
            }));

            // برای هر هفته، پارت‌هاش رو بگیر
            const weeksWithParts = await Promise.all(weeks.map(async (week) => {
                const { data: parts } = await sb
                    .from('parts')
                    .select('*')
                    .eq('week_id', week.id)
                    .order('part_number');
                return { ...week, parts: parts || [] };
            }));

            renderLessons(lessonsWithStats);
            renderWeeks(weeksWithParts);
        }

     function renderLessons(lessons) {

    const container = document.getElementById('public-lessons');

    if (!lessons.length) {
        container.innerHTML =
            '<div class="empty-state">درسی ثبت نشده است</div>';
        return;
    }

    container.innerHTML = lessons.map(lesson => {

        const icon =
            LESSON_ICONS.find(i => i.id === lesson.icon_id) ||
            LESSON_ICONS[0];

        const done = lesson.doneTests || 0;
        const total = lesson.totalTests || 0;
        const remaining = Math.max(0, total - done);

        const progress =
            total > 0
                ? Math.round((done / total) * 100)
                : 0;

        return `
        <div class="lesson-card">

            <div class="lesson-card-header">

                <div class="lesson-info">

                    <div class="lesson-icon">
                        ${icon.svg}
                    </div>

                    <div>

                        <div class="lesson-name">
                            ${lesson.name}
                        </div>

                        <div class="lesson-summary">
                            ${done} از ${total} تست تکمیل شده
                        </div>

                    </div>

                </div>

            </div>

            <div class="lesson-body open">

                <div class="lesson-progress">

                    <div class="progress-bar">
                        <div
                            class="progress-fill"
                            style="width:${progress}%">
                        </div>
                    </div>

                    <div class="progress-text">
                        <span>${progress}% پیشرفت</span>
                        <span>${remaining} تست باقی مانده</span>
                    </div>

                </div>

                <div class="source-item">

                    <div class="source-header">

                        <div class="source-title">
                            وضعیت کلی درس
                        </div>

                    </div>

                    <div class="source-stats-row">

                        <div class="stat stat-done">
                            ✅ ${done} زده شده
                        </div>

                        <div class="stat">
                            📚 ${total} کل تست
                        </div>

                        <div class="stat stat-remaining">
                            ⏳ ${remaining} باقی مانده
                        </div>

                    </div>

                </div>

            </div>

        </div>
        `;

    }).join('');
}

       function renderWeeks(weeks) {

    const container = document.getElementById('public-weeks');

    if (!weeks.length) {
        container.innerHTML = `
            <div class="empty-state">
                برنامه‌ای ثبت نشده است
            </div>
        `;
        return;
    }

    container.innerHTML = weeks.map(week => {

        const parts = week.parts || [];

        return `
            <div class="week-card">

                <div class="week-header">
                    <div>
                        <div class="week-title">
                            📅 هفته ${week.week_number}
                        </div>

                        <div class="week-date">
                            ${week.start_date || ''} تا ${week.end_date || ''}
                        </div>
                    </div>
                </div>

                <div class="parts-grid">

                    ${parts.map(part => `
                        <div class="part-card ${part.is_done ? 'done' : ''}">

                            <div class="part-header">
                                <span class="part-number">
                                    پارت ${part.part_number}
                                </span>

                                <span>
                                    ${part.is_done ? '✅' : '⬜'}
                                </span>
                            </div>

                            <div class="part-day">
                                ${part.day_name || ''}
                            </div>

                            <div class="part-tests">
                                ${part.tests_done || 0} تست
                            </div>

                        </div>
                    `).join('')}

                </div>

            </div>
        `;
    }).join('');
}
    </script>
</body>
</html>
