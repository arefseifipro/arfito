<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ورود به آرفیتو</title>

<!-- فونت وزیرمتن -->
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v36/Vazirmatn-font-face.css" rel="stylesheet">
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.0.0/dist/umd/supabase.min.js"></script>
</head>

<style>
:root{
  --blue:#0b78ff;
  --blue-600:#095ee0;
  --muted:#9aa3b2;
  --bg:#ffffff;
  --panel:#ffffff;
  --border:#0b78ff;
  --green:#2ecc71;
  --red:#e74c3c;
  --radius-xl:42px;   /* گوشه‌های خیلی گرد برای کارت */
  --radius-md:12px;   /* گوشه‌های اینپوت و دکمه */
  --shadow:0 12px 40px rgba(11,120,255,.07);

  /* جدید - اندازه فرم جمع‌تر */
  --card-max-width:560px;

  /* ripple color */
  --ripple-light: rgba(255,255,255,0.28);
  --ripple-dark: rgba(0,0,0,0.18);
}

/* تم تاریک */
body.dark-mode{
  --bg: #0f172a;
  --panel: #111827; /* کارت در دارک */
  --border: #334155;
  --muted: #94a3b8;
  color: #e2e8f0;

}

/* پایه */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:linear-gradient(180deg,#fff 0%,#f7fbff 100%);
  font-family:"Vazirmatn",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
  color:#1b2b46;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px;
  transition: background .25s ease, color .25s ease;
  max-height: 950px;
  min-height: 912px;
}
body.dark-mode{
  background:linear-gradient(180deg,#071028 0%,#0b1320 100%);
}

/* تم/دکمه تغییر تم */


/* دکمه بازگشت – قاب سالم با برش دکوری نرم در وسط */
.back{
  position:fixed; top:22px; left:22px; z-index:40;
}
.back button{
  background:var(--panel);
  border:3px solid var(--blue);
  color:var(--blue);
  padding:10px 20px;
  border-radius:999px;
  font-weight:70;
  cursor:pointer;
  line-height:1;
  position:relative;
  /*overflow:visible; /* اجازه نمایش برش */
  transition:transform .15s ease, box-shadow .18s ease, background .18s ease, color .18s ease;
  z-index:1;
  color: #0b78ff;
  font-family:"Vazirmatn",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
}
/* برش دکوری (نشانِ روشنایی که وسط قرار می‌گیرد) */
.back button::before{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:48px;
  height:18px;
  border-radius:8px;
  /*background:var(--panel); /* هم‌رنگ پس‌زمینه صفحه/کارت */
  /*box-shadow: 0 2px 6px rgba(255,255,255,0.18) inset;*/
  pointer-events:none;
  transition:background .18s ease, box-shadow .18s ease;
}
/* وقتی هاور */
.back button:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 30px rgba(11,120,255,.14);
  background:var(--blue);
  color: white;
}
/* پیام‌های بالا-راست */
.messages{
  position:fixed; top:18px; right:22px;
  display:flex; flex-direction:column; gap:12px; z-index:30;
}
.msg{
  min-width:220px; padding:10px 18px; border-radius:12px; color:#fff; font-weight:700;
  box-shadow:0 10px 24px rgba(0,0,0,.12); opacity:.98;
}
.msg.success{ background:var(--green) }
.msg.error{ background:var(--red) }

/* کارت اصلی */
.card{
  width:min(var(--card-max-width),92vw); /* جمع‌تر */
  background:var(--panel);
  border:4px solid var(--border);
  border-radius:var(--radius-xl);
  box-shadow:var(--shadow);
  padding:72px 42px 38px;
  position:relative;
  overflow:visible;
  transition:background .25s ease, border-color .25s ease, box-shadow .25s ease;
}

/* لوگو دایره‌ای بیرون‌زده از بالای قاب *//*
.logo{
  position:absolute; top:-62px; left:50%; transform:translateX(-50%);
  width:120px; height:120px; border-radius:50%;
  background:var(--panel);
  border:4px solid var(--blue);
  display:flex; align-items:center; justify-content:center;
  font-weight:800; color:var(--blue);
  box-shadow:0 10px 24px rgba(11,120,255,.08);
}*/

/* تیتر */
h1{
  margin:0 0 28px;
  text-align:center;
  color:var(--blue);
  font-size:26px; font-weight:800;
  letter-spacing:.2px;
}

/* فرم */
form{ display:flex; flex-direction:column; gap:18px }

/* گروه اینپوت با لیبل شناور */
.field{ position:relative; }
.input{
  width:100%;
  height:48px;
  padding:12px 44px 12px 44px; /* جا برای آیکون چشم سمت چپ */
  background:var(--panel);
  border:2.5px solid var(--blue);
  border-radius:var(--radius-md);
  outline:none;
  font-size:14px;
  transition:border-color .18s ease, box-shadow .18s ease, transform .08s ease, background .18s ease;
}
.input::placeholder{ color:#bfcfe8 }
.input:focus{
  box-shadow:0 10px 30px rgba(11,120,255,.08);
  transform:translateY(-1px);
}
body.dark-mode .input{
  background: #0b1220;
  border-color: var(--border);
  color: #e2e8f0;
}

/* لیبل – قبل از فعال شدن بیرون کادر؛ بعد از فعال شدن می‌آید روی قاب و آبی می‌شود */
.label{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  font-size:14px;
  color:#7f8aa3;
  pointer-events:none;
  transition:all .18s ease;
  background:transparent;
  padding:0 6px;
}
.input:focus + .label,
.input:not(:placeholder-shown) + .label{
  top:-12px;
  transform:none;
  font-size:12px;
  color:var(--blue);
  background:var(--panel);       /* برای اینکه روی قاب “بخوابد” */
}

/* آیکون چشم (باز/بسته) */
.eye-open{
  position:absolute;
  left:12px; top:50%; transform:translateY(-50%);
  width:26px; height:26px; display:flex; align-items:center; justify-content:center;
  border-radius:10px; cursor:pointer; user-select:none;
  transition: background .15s ease, transform .12s ease;
}
.eye-open:hover{ transform:translateY(-50%) scale(1.04) }
.eye-open svg{ width:20px; height:20px; fill:var(--blue); transition:transform .18s ease; }
    .eye-open {
      display: none;
    }
    .show .eye-open {
      display: block;
    }
    .show .eye-closed {
      display: none;
    }
.eye-closed{
  position:absolute;
  left:12px; top:50%; transform:translateY(-50%);
  width:26px; height:26px; display:flex; align-items:center; justify-content:center;
  border-radius:10px; cursor:pointer; user-select:none;
  transition: background .15s ease, transform .12s ease;
}
.eye-closed:hover{ transform:translateY(-50%) scale(1.04) }
.eye-closed svg{ width:15px; height:15px; fill:var(--blue); transition:transform .18s ease; }
/* ردیف فراموشی رمز و ... */
.row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.row a{ color:var(--blue); text-decoration:none; font-weight:700; }
.helper{ color:var(--muted); font-size:13px }

/* دکمه ورود - شیک‌تر + ripple */
.btn{
  height:48px; border-radius:var(--radius-md);
  background:linear-gradient(135deg,var(--blue),var(--blue-600));
  color:#fff; border:none; font-weight:800; font-size:15px; cursor:pointer;
  position:relative; overflow:hidden;
  transition:background .18s ease, transform .08s ease, box-shadow .18s ease;
  font-family:"Vazirmatn",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
}
.btn:hover{ background:linear-gradient(135deg,var(--blue-600),#063fad); transform:translateY(-1px); box-shadow:0 12px 36px rgba(11,120,255,.18); }

/* ripple element */
.btn .ripple{
  position:absolute;
  border-radius:50%;
  transform:scale(0);
  animation:ripple 700ms linear;
  background:var(--ripple-light);
  pointer-events:none;
}
@keyframes ripple{
  to{ transform:scale(6); opacity:0; }
}

/* جداکننده “یا” */
.or{ display:flex; align-items:center; gap:14px; margin:6px 0; }
.or .line{ flex:1; height:2.5px; background:linear-gradient(90deg,#e5e7ee,#dadde6); border-radius:4px; }
.or .txt{ color:#b3bac8; font-size:13px }

/* ثبت‌نام */
.muted{ text-align:center; color:#b4bbc8; }
.muted a{ color:var(--blue); font-weight:800; text-decoration:none; }

/* SVG دکوری (دایره‌های نرم) */
.decor{ position:absolute; border-radius:50%; opacity:.14; z-index:0; pointer-events:none; }
.decor.circle1{ width:140px;height:140px; background:var(--blue); top:-60px; right:-60px; filter:blur(10px); }
.decor.circle2{ width:90px;height:90px; background:#f59e0b; bottom:-40px; left:-40px; filter:blur(6px); }

@media (max-width:720px){
  .card{ padding:64px 22px 28px; border-radius:34px; }
  .logo{ width:96px;height:96px; top:-50px; }
}
.logo img{
  width: 160px;
  height: 160px;
  border-radius: 50%;
  border: 4px solid #f0c040;
  object-fit: cover;
  box-shadow: 0 0 20px #f0c04055;
  animation: pop 1.2s ease-out;
    position:absolute; top:-62px; left:50%; transform:translateX(-50%);
  width:120px; height:120px; border-radius:50%;
  background:var(--panel);
  border:4px solid var(--blue);
  display:flex; align-items:center; justify-content:center;
  font-weight:800; color:var(--blue);
  box-shadow:0 10px 24px rgba(11,120,255,.08);
}
</style>
</head>

<script>
(function(){
  // عناصر
  const eye = document.getElementById('toggleEye');
  const eyeIcon = document.getElementById('eyeIcon');
  const pwd = document.getElementById('password');
  const themeToggle = document.getElementById('themeToggle');
  const loginBtn = document.getElementById('loginBtn');
  const backBtn = document.getElementById('backBtn');
  const success = document.getElementById('successMsg');
  const error = document.getElementById('errorMsg');
  const form = document.getElementById('loginForm');

  const password = document.getElementById("password");
    const toggleIcon = document.getElementById("toggleIcon");

    toggleIcon.addEventListener("click", () => {
      if (password.type === "password") {
        password.type = "text";
        toggleIcon.classList.add("show"); // چشم باز نشون داده شه
      } else {
        password.type = "password";
        toggleIcon.classList.remove("show"); // چشم بسته برگرده
      }
    });
   
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const storedTheme = localStorage.getItem('theme');

    const applyTheme = (mode) => {
      document.body.classList.remove('light-mode', 'dark-mode');
      document.body.classList.add(mode === 'light' ? 'light-mode' : 'dark-mode');
      localStorage.setItem('theme', mode);
    };

    if (storedTheme) {
      applyTheme(storedTheme);
    } else {
      applyTheme(prefersDark ? 'dark' : 'light');
    }
  // دکمه بازگشت
  backBtn.addEventListener('click', ()=>{
    if(history.length > 1) history.back(); else alert('بازگشت به صفحه قبل (دمو)');
  });

  // نمایش پیام helper
  function showMsg(el, text, duration=2500){
    el.textContent = text;
    el.style.display = 'block';
    el.animate([{opacity:0, transform:'translateY(-6px)'},{opacity:1, transform:'translateY(0)'}], {duration:260, fill:'forwards'});
    setTimeout(()=> {
      el.animate([{opacity:1},{opacity:0}], {duration:260, fill:'forwards'});
      setTimeout(()=> el.style.display='none', 260);
    }, duration);
  }

  // ripple effect for login button
  loginBtn.addEventListener('click', function(e){
    // prevent form submit here so demo validation runs in submit handler
    // create ripple
    const rect = this.getBoundingClientRect();
    const ripple = document.createElement('span');
    ripple.className='ripple';
    const size = Math.max(rect.width, rect.height) * 0.6;
    ripple.style.width = ripple.style.height = size + 'px';
    // position relative to button
    const x = e.clientX - rect.left - size/2;
    const y = e.clientY - rect.top - size/2;
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    // color depends on theme
    if(document.body.classList.contains('dark')){
      ripple.style.background = 'var(--ripple-dark)';
    } else {
      ripple.style.background = 'var(--ripple-light)';
    }
    this.appendChild(ripple);
    // remove after animation
    setTimeout(()=> ripple.remove(), 800);
  });


})();
</script>
